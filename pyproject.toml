[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-diff"
version = "0.3.2"
description = "Which deploy moved the AWS bill: daily Cost Explorer cost steps, attributed to deploys"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "build>=1.2", "basedpyright>=1.31"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/cost-diff"
Issues = "https://github.com/fabiocicerchia/cost-diff/issues"
Changelog = "https://github.com/fabiocicerchia/cost-diff/blob/main/CHANGELOG.md"

[project.scripts]
cost-diff = "cost_diff:main"

[tool.setuptools]
py-modules = ["cost_diff"]

[tool.pytest.ini_options]
# Import cost_diff from the checkout, not from whatever version happens to be
# installed in site-packages. Without this a stale install silently shadows the
# tree and the suite grades code that is not in this repo.
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# U+2212 MINUS SIGN is deliberate in the money columns -- it is the character
# that lines up with a digit, which a hyphen does not. U+03C3 SIGMA is the unit
# the timeline reports a step size in; spelling it "sigma" in a table is worse.
allowed-confusables = ["−", "σ"]
select = [
  "E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A", "C4", "DTZ",
  "T20", "PT", "RET", "SIM", "PTH", "ERA", "TD", "FIX", "PLR2004", "TRY", "PL", "RUF",
]
ignore = [
  "ANN401",      # Any in *args/**kwargs — FC-GEN-016's comment rule covers it
  "TRY003",      # long messages inline; FC-GEN-022 wants them descriptive
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
# `assert` is what a test is, and an expected value is the literal it compares
# against -- naming it moves the assertion one step from the thing asserted.
"tests/**" = [
  "S101",     # `assert` is what a test is
  "PLR2004",  # an expected value is the literal it compares against
  "ANN001",   # a fixture or a fake's argument, named by the test that builds it
]

[tool.basedpyright]
# FC-PY-003 asks for strict. The point of a type checker in CI is that it knows
# the types: "unknown" is the finding, not a level of detail to relax away.
typeCheckingMode = "strict"
# Matches requires-python, so the checker rejects what the oldest supported
# interpreter would reject rather than what this machine happens to run.
pythonVersion = "3.10"
# Third-party stubs are not this repository's to ship, and a missing one is a
# packaging fact about someone else's project rather than a defect here.
reportMissingTypeStubs = false

# The man page rides along in the wheel: `pip install` puts it under
# <prefix>/share/man/man1, which is on the default manpath for a system install
# and for a --user one alike.
[tool.setuptools.data-files]
"share/man/man1" = ["man/cost-diff.1"]
