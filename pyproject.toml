[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-diff"
version = "0.2.2"
description = "Diff two AWS Cost Explorer periods into a human-readable what-changed report"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/cost-diff"
Issues = "https://github.com/fabiocicerchia/cost-diff/issues"
Changelog = "https://github.com/fabiocicerchia/cost-diff/blob/main/CHANGELOG.md"

[project.scripts]
cost-diff = "cost_diff:main"

[tool.setuptools]
py-modules = ["cost_diff"]

[tool.pytest.ini_options]
# Import cost_diff from the checkout, not from whatever version happens to be
# installed in site-packages. Without this a stale install silently shadows the
# tree and the suite grades code that is not in this repo.
pythonpath = ["."]

[tool.ruff]
line-length = 100
