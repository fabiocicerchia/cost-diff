[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-diff"
version = "0.2.1"
description = "Diff two AWS Cost Explorer periods into a human-readable what-changed report"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/cost-diff"
Issues = "https://github.com/fabiocicerchia/cost-diff/issues"
Changelog = "https://github.com/fabiocicerchia/cost-diff/blob/main/CHANGELOG.md"

[project.scripts]
cost-diff = "cost_diff:main"

[tool.setuptools]
py-modules = ["cost_diff"]

[tool.pytest.ini_options]
# Import cost_diff from the checkout, not from whatever version happens to be
# installed in site-packages. Without this a stale install silently shadows the
# tree and the suite grades code that is not in this repo.
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# U+2212 MINUS SIGN is deliberate in the money columns -- it is the character
# that lines up with a digit, which a hyphen does not.
allowed-confusables = ["−"]
select = [
  "E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A", "C4", "DTZ",
  "T20", "PT", "RET", "SIM", "PTH", "ERA", "TD", "FIX", "PLR2004", "TRY", "PL", "RUF",
]
ignore = [
  "ANN401",      # Any in *args/**kwargs — FC-GEN-016's comment rule covers it
  "TRY003",      # long messages inline; FC-GEN-022 wants them descriptive
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
# `assert` is what a test is, and an expected value is the literal it compares
# against -- naming it moves the assertion one step from the thing asserted.
"tests/**" = [
  "S101",     # `assert` is what a test is
  "PLR2004",  # an expected value is the literal it compares against
  "ANN001",   # a fixture or a fake's argument, named by the test that builds it
]
